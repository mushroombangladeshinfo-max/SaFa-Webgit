<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interviews — SaFa Naturals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>html.auth-checking *:not(style){visibility:hidden!important;}</style>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-size:15px;}
    :root{--bg:#060d09;--bg2:#0d1f12;--bg3:#122018;--border:rgba(255,255,255,.07);--c:#f5efe6;--cm:rgba(245,239,230,.6);--cl:rgba(245,239,230,.35);--al:#c49a3c;--green:#5fcf80;--red:#e05a2b;--blue:#50c8ff;}
    body{font-family:'DM Sans','Hind Siliguri',sans-serif;background:var(--bg);color:var(--c);min-height:100vh;margin:0;-webkit-font-smoothing:antialiased;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .page{max-width:1000px;margin:0 auto;padding:28px 24px 64px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--cl);text-decoration:none;font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;}
    .back-link:hover{color:var(--c);}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
    .page-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:22px;font-weight:700;color:var(--c);margin:0 0 4px;}
    .page-sub{font-size:13px;color:var(--cl);}
    .btn{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--cl);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{color:var(--c);background:rgba(255,255,255,.08);}
    .btn.primary{background:rgba(196,154,60,.12);border-color:rgba(196,154,60,.3);color:var(--al);}
    .btn.primary:hover{background:rgba(196,154,60,.2);}
    .btn.sm{padding:6px 10px;font-size:8px;}
    .table-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .table-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cl);}
    .scroll-x{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
    td{padding:12px 14px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(255,255,255,.02);}
    .empty-state{text-align:center;padding:48px 20px;color:var(--cl);}
    .empty-icon{font-size:32px;margin-bottom:10px;}
    .pill{display:inline-flex;padding:3px 9px;border-radius:20px;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
    .pill-scheduled{background:rgba(80,200,255,.1);color:var(--blue);}
    .pill-completed{background:rgba(95,207,128,.12);color:var(--green);}
    .pill-cancelled{background:rgba(255,255,255,.05);color:var(--cl);}
    #f-preparation_status{border-radius:20px;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--border);background:var(--bg2);color:var(--cl);cursor:pointer;}
    #f-preparation_status.prep-in_progress{background:rgba(196,154,60,.12);color:var(--al);border-color:rgba(196,154,60,.3);}
    #f-preparation_status.prep-ready{background:rgba(95,207,128,.12);color:var(--green);border-color:rgba(95,207,128,.3);}
    .accordion{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
    .accordion summary{padding:10px 12px;cursor:pointer;font-size:13px;list-style:none;display:flex;gap:10px;align-items:center;}
    .accordion summary::-webkit-details-marker{display:none;}
    .accordion summary .q-cat{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--al);background:rgba(196,154,60,.1);padding:2px 7px;border-radius:4px;flex-shrink:0;}
    .accordion-body{padding:0 12px 12px;font-size:12.5px;color:var(--cm);line-height:1.6;}
    .accordion-body p{margin:4px 0;}
    .row-link{color:inherit;text-decoration:none;}
    .row-link:hover .iv-company{color:var(--al);}

    .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
    .card-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--al);margin-bottom:14px;}
    label.f{display:block;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl);margin-bottom:6px;}
    input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--c);font-family:'DM Sans','Hind Siliguri',sans-serif;font-size:14px;padding:9px 12px;outline:none;width:100%;}
    input:focus,select:focus,textarea:focus{border-color:rgba(196,154,60,.5);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
    .form-group.span2{grid-column:span 2;}
    .ai-output{background:rgba(196,154,60,.06);border:1px solid rgba(196,154,60,.2);border-radius:8px;padding:16px;margin-top:14px;font-size:13px;line-height:1.6;}
    .ai-output h4{font-family:'Syne',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--al);margin:14px 0 4px;}
    .ai-output h4:first-child{margin-top:0;}
    .ai-output ul{margin:4px 0;padding-left:18px;}
    .self-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
    @media(max-width:600px){.self-grid{grid-template-columns:1fr;}}
    .self-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--cm);}
    .self-row select{width:70px;}
    .q-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
    .q-tag{font-size:10px;color:var(--cl);text-transform:uppercase;}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
    .modal-overlay.open{display:flex;animation:fadeUp .2s ease;}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:26px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px;}
    .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}

    .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
    .toast{padding:12px 18px;border-radius:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;animation:fadeUp .3s ease;}
    .toast.ok{background:#1a3322;border:1px solid rgba(95,207,128,.3);color:var(--green);}
    .toast.err{background:#2a1510;border:1px solid rgba(224,90,43,.3);color:var(--red);}
  </style>
</head>
<body>

  <div class="page">
    <!-- List view -->
    <div id="list-view">
      <div class="page-header">
        <div>
          <div class="page-title">Job <span style="color:var(--al)">Interviews</span></div>
          <div class="page-sub">Every round, tracked with prep, self-assessment, and question history.</div>
        </div>
        <span class="rt-indicator" id="rt-indicator"><span class="rt-dot"></span>Live</span>
        <button class="btn primary" id="add-btn">+ Schedule Interview</button>
      </div>
      <div id="profile-bar"></div>
      <div class="table-card">
        <div class="table-toolbar"><span class="table-title">Interviews</span><span class="count-label" id="iv-count" style="font-size:13px;color:var(--cl);"></span></div>
        <div class="scroll-x">
          <table>
            <thead><tr><th>Company / Role</th><th>Round</th><th>Type</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="5"><div class="empty-state"><div class="empty-icon">⏳</div>Loading...</div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Detail / prep view -->
    <div id="detail-view" style="display:none;">
      <a href="job-interviews.html" class="back-link">← All Interviews</a>
      <div class="page-header">
        <div>
          <div class="page-title" id="dv-title">—</div>
          <div class="page-sub" id="dv-sub"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="f-preparation_status" aria-label="Preparation status"></select>
          <button class="btn primary" id="ai-prep-btn">✦ Prepare Interview with AI</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Logistics</div>
        <div class="form-grid">
          <div class="form-group"><label class="f" for="f-round">Round</label><input type="text" id="f-round"></div>
          <div class="form-group"><label class="f" for="f-interview_type">Type</label>
            <select id="f-interview_type"><option value="">Select...</option></select>
          </div>
          <div class="form-group"><label class="f" for="f-interview_date">Date</label><input type="date" id="f-interview_date"></div>
          <div class="form-group"><label class="f" for="f-interview_time">Time</label><input type="text" id="f-interview_time"></div>
          <div class="form-group"><label class="f" for="f-duration_minutes">Duration (min)</label><input type="number" id="f-duration_minutes" min="0"></div>
          <div class="form-group"><label class="f" for="f-interviewers">Interviewers</label><input type="text" id="f-interviewers"></div>
          <div class="form-group"><label class="f" for="f-status">Status</label><select id="f-status"><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
          <div class="form-group"><label class="f" for="f-location_or_link">Location / Link</label><input type="text" id="f-location_or_link"></div>
          <div class="form-group span2"><label class="f" for="f-logistics_notes">Logistics Notes</label><textarea id="f-logistics_notes" rows="2"></textarea></div>
        </div>
        <div style="margin-top:12px;"><button class="btn sm primary" id="save-logistics-btn">Save Logistics</button></div>
      </div>

      <div class="card">
        <div class="card-title">Prep Workspace</div>
        <div class="form-grid">
          <div class="form-group span2"><label class="f" for="f-company_research">Company Research</label><textarea id="f-company_research" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f" for="f-role_research">Role Research</label><textarea id="f-role_research" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f" for="f-expected_questions">Expected Questions</label><textarea id="f-expected_questions" rows="4"></textarea></div>
          <div class="form-group span2"><label class="f" for="f-star_stories">STAR Stories</label><textarea id="f-star_stories" rows="4"></textarea></div>
          <div class="form-group span2"><label class="f" for="f-tech_prep">Technical / Case Preparation</label><textarea id="f-tech_prep" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f" for="f-questions_to_ask">Questions to Ask Employer</label><textarea id="f-questions_to_ask" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f" for="f-general_notes">General Notes</label><textarea id="f-general_notes" rows="3"></textarea></div>
        </div>
        <div style="margin-top:12px;"><button class="btn sm primary" id="save-prep-btn">Save Prep</button></div>
        <div class="ai-output" id="ai-output" style="display:none;"></div>
      </div>

      <div class="card">
        <div class="card-title">Question Log</div>
        <div id="q-list"></div>
        <div class="form-grid" style="margin-top:10px;">
          <div class="form-group span2"><label class="f" for="q-question">Question Asked</label><input type="text" id="q-question"></div>
          <div class="form-group"><label class="f" for="q-tag">Tag</label>
            <select id="q-tag"><option value="">Select...</option></select>
          </div>
        </div>
        <div style="margin-top:10px;"><button class="btn sm" id="add-question-btn">+ Add Question</button></div>
      </div>

      <div class="card">
        <div class="card-title">Post-Interview Reflection &amp; Self-Assessment</div>
        <div class="self-grid" id="self-assessment-grid"></div>
        <div class="form-group span2" style="margin-top:14px;"><label class="f" for="f-post_interview_reflection">Reflection — what went well, what could improve, unexpected questions, what you'd answer differently</label><textarea id="f-post_interview_reflection" rows="4"></textarea></div>
        <div class="form-group span2" style="margin-top:10px;"><label class="f" for="f-outcome">Outcome</label><input type="text" id="f-outcome" placeholder="e.g. Awaiting next round"></div>
        <div style="margin-top:12px;"><button class="btn sm primary" id="save-reflection-btn">Save Reflection</button></div>
      </div>
    </div>
  </div>

  <!-- Schedule modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title">Schedule Interview</div>
      <div class="form-grid">
        <div class="form-group span2"><label class="f" for="m-opportunity_id">Opportunity *</label><select id="m-opportunity_id"></select></div>
        <div class="form-group"><label class="f" for="m-round">Round</label><input type="text" id="m-round"></div>
        <div class="form-group"><label class="f" for="m-interview_type">Type</label>
          <select id="m-interview_type"><option value="">Select...</option></select>
        </div>
        <div class="form-group"><label class="f" for="m-interview_date">Date</label><input type="date" id="m-interview_date"></div>
        <div class="form-group"><label class="f" for="m-interview_time">Time</label><input type="text" id="m-interview_time"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-save">Schedule</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { requireAdmin }  from '/src/admin-auth.js';
    import { mountAdminNav } from '/src/admin-nav.js';
    import { loadAiCfg, chatComplete } from '/src/ai-client.js';
    import { localDateStr } from '/src/date-utils.js';
    import { subscribeRealtime, injectRealtimeStyles } from '/src/realtime.js';
    import { escapeHtml } from '/src/html-utils.js';
    import { INTERVIEW_TYPES, QUESTION_TAGS, PREPARATION_STATUSES, optionsHtml, valueLabelOptionsHtml } from '/src/job-constants.js';
    import { ensureActiveProfileId, renderProfileSwitcher } from '/src/job-profile.js';
    import { structuredProfileToText } from '/src/career-diagnostic.js';

    document.documentElement.classList.add('auth-checking');
    const sb = createClient(
      import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_ANON_KEY
    );
    const session = await requireAdmin(sb);
    if (!session) { window.location.href = 'orders.html'; }
    document.documentElement.classList.remove('auth-checking');
    mountAdminNav({ page: 'job-interviews', supabase: sb, email: session.user.email });

    document.getElementById('f-interview_type').innerHTML += optionsHtml(INTERVIEW_TYPES);
    document.getElementById('q-tag').innerHTML += optionsHtml(QUESTION_TAGS);
    document.getElementById('m-interview_type').innerHTML += optionsHtml(INTERVIEW_TYPES);
    document.getElementById('f-preparation_status').innerHTML = valueLabelOptionsHtml(PREPARATION_STATUSES);

    function toast(msg, type='ok') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-wrap').appendChild(el);
      setTimeout(()=>el.remove(), 3500);
    }

    const params = new URLSearchParams(location.search);
    const ivId = params.get('id');
    let profileId = null;

    const SELF_DIMS = [
      ['communication','Communication'],['structure','Answer Structure'],['role_knowledge','Role Knowledge'],
      ['company_knowledge','Company Knowledge'],['technical_knowledge','Technical Knowledge'],['evidence','Evidence / Examples'],
      ['confidence','Confidence'],['motivation','Motivation'],['questions_asked','Questions Asked'],['german_performance','German Performance'],
    ];

    // Detail mode (?id=) shows no switcher — it's already one specific
    // interview, unambiguously belonging to one profile (derived from the
    // loaded row itself in loadDetail(), never from whichever profile the
    // switcher elsewhere happens to be on). List mode shows the switcher
    // and scopes the list query to the active profile.
    if (ivId) {
      document.getElementById('list-view').style.display = 'none';
      loadDetail();
    } else {
      document.getElementById('detail-view').style.display = 'none';
      profileId = await ensureActiveProfileId(sb);
      renderProfileSwitcher(sb, document.getElementById('profile-bar'), async () => { profileId = await ensureActiveProfileId(sb); loadList(); });
      loadList();
    }

    /* ── List ── */
    async function loadList() {
      const { data, error } = await sb.from('job_interviews').select('*, job_opportunities(company,job_title)').eq('profile_id', profileId).order('interview_date', { ascending: false });
      if (error) { toast(error.message, 'err'); return; }
      const rows = data || [];
      document.getElementById('iv-count').textContent = `${rows.length} interview${rows.length!==1?'s':''}`;
      if (!rows.length) {
        document.getElementById('tbody').innerHTML = '<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">🎤</div>No interviews scheduled yet.</div></td></tr>';
        return;
      }
      document.getElementById('tbody').innerHTML = rows.map(iv => `
        <tr><td><a class="row-link" href="job-interviews.html?id=${iv.id}">
          <div class="iv-company" style="font-weight:600;">${escapeHtml(iv.job_opportunities?.company)||'—'}</div>
          <div style="font-size:12px;color:var(--cl);">${escapeHtml(iv.job_opportunities?.job_title)}</div>
        </a></td>
        <td>${escapeHtml(iv.round)||'—'}</td><td style="color:var(--cl);font-size:13px;">${escapeHtml(iv.interview_type)||'—'}</td>
        <td style="color:var(--cl);font-size:13px;">${iv.interview_date||'—'}</td>
        <td><span class="pill pill-${iv.status}">${iv.status}</span></td></tr>`).join('');
    }

    document.getElementById('add-btn').addEventListener('click', async () => {
      const { data } = await sb.from('job_opportunities').select('id,company,job_title').eq('profile_id', profileId).eq('closed', false).order('company');
      document.getElementById('m-opportunity_id').innerHTML = (data||[]).map(o => `<option value="${o.id}">${o.company} — ${o.job_title}</option>`).join('');
      ['m-round','m-interview_type','m-interview_date','m-interview_time'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('modal').classList.add('open');
    });
    document.getElementById('modal-cancel').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));
    document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });
    document.getElementById('modal-save').addEventListener('click', async () => {
      const opportunity_id = document.getElementById('m-opportunity_id').value;
      if (!opportunity_id) { toast('Pick an opportunity', 'err'); return; }
      const payload = {
        profile_id: profileId,
        opportunity_id,
        round: document.getElementById('m-round').value.trim() || null,
        interview_type: document.getElementById('m-interview_type').value || null,
        interview_date: document.getElementById('m-interview_date').value || null,
        interview_time: document.getElementById('m-interview_time').value.trim() || null,
      };
      const { data, error } = await sb.from('job_interviews').insert([payload]).select().single();
      if (error) { toast(error.message, 'err'); return; }
      await sb.from('job_activities').insert([{ profile_id: profileId, opportunity_id, activity_type: 'Interview', activity_date: payload.interview_date || localDateStr(), summary: `Interview scheduled${payload.round?': '+payload.round:''}` }]);
      toast('Interview scheduled');
      window.location.href = `job-interviews.html?id=${data.id}`;
    });

    /* ── Detail ── */
    let iv = null;
    const LOGISTICS_FIELDS = ['round','interview_type','interview_date','interview_time','duration_minutes','interviewers','status','location_or_link','logistics_notes'];
    const PREP_FIELDS = ['company_research','role_research','expected_questions','star_stories','tech_prep','questions_to_ask','general_notes'];

    async function loadDetail() {
      const { data, error } = await sb.from('job_interviews').select('*, job_opportunities(id,company,job_title,job_description)').eq('id', ivId).maybeSingle();
      if (error || !data) { toast(error?.message || 'Interview not found', 'err'); return; }
      iv = data;
      document.getElementById('dv-title').textContent = `${iv.job_opportunities?.company||''} — ${iv.job_opportunities?.job_title||''}`;
      document.getElementById('dv-sub').textContent = [iv.round, iv.interview_type, iv.interview_date].filter(Boolean).join(' · ');
      LOGISTICS_FIELDS.forEach(f => { document.getElementById('f-'+f).value = iv[f] || (f==='status' ? 'scheduled' : ''); });
      PREP_FIELDS.forEach(f => { document.getElementById('f-'+f).value = iv[f] || ''; });
      document.getElementById('f-post_interview_reflection').value = iv.post_interview_reflection || '';
      document.getElementById('f-outcome').value = iv.outcome || '';
      setPrepStatusUI(iv.preparation_status || 'not_started');
      renderSelfAssessment();
      loadQuestions();
    }

    function setPrepStatusUI(status) {
      const sel = document.getElementById('f-preparation_status');
      sel.value = status;
      sel.className = status === 'not_started' ? '' : 'prep-' + status;
    }
    async function setPrepStatus(status) {
      const { error } = await sb.from('job_interviews').update({ preparation_status: status }).eq('id', ivId);
      if (error) { toast(error.message, 'err'); return; }
      setPrepStatusUI(status);
    }
    document.getElementById('f-preparation_status').addEventListener('change', (e) => setPrepStatus(e.target.value));

    document.getElementById('save-logistics-btn').addEventListener('click', async () => {
      const payload = {};
      LOGISTICS_FIELDS.forEach(f => { const v = document.getElementById('f-'+f).value; payload[f] = v || null; });
      const { error } = await sb.from('job_interviews').update(payload).eq('id', ivId);
      if (error) { toast(error.message, 'err'); return; }
      toast('Logistics saved');
      loadDetail();
    });
    document.getElementById('save-prep-btn').addEventListener('click', async () => {
      const payload = {};
      PREP_FIELDS.forEach(f => { payload[f] = document.getElementById('f-'+f).value.trim() || null; });
      const { error } = await sb.from('job_interviews').update(payload).eq('id', ivId);
      if (error) { toast(error.message, 'err'); return; }
      toast('Prep saved');
    });

    /* ── AI Interview Prep ── */
    function listOrDash(arr, render) {
      return (arr && arr.length) ? `<ul>${arr.map(x=>`<li>${render ? render(x) : escapeHtml(x)}</li>`).join('')}</ul>` : '<div style="color:var(--cl)">None.</div>';
    }
    document.getElementById('ai-prep-btn').addEventListener('click', async () => {
      const btn = document.getElementById('ai-prep-btn');
      btn.textContent = 'Preparing...'; btn.disabled = true;
      try {
        const cfg = await loadAiCfg(sb);
        if (cfg.provider === 'openai' && !cfg.key) { toast('Configure a Groq key on the Home page first', 'err'); return; }
        const { data: profile } = await sb.from('job_profiles').select('*').eq('id', iv.profile_id).maybeSingle();
        if (profile?.status !== 'confirmed') {
          const box = document.getElementById('ai-output');
          box.style.display = '';
          box.innerHTML = `<div>Complete and confirm your <a href="job-settings.html" style="color:var(--al);">Career Profile diagnostic</a> first — Interview Prep needs a confirmed profile to draw evidence from.</div>`;
          return;
        }
        const profileText = structuredProfileToText(profile.structured_profile)
          || ['education','work_experience','projects','skills','languages','career_narrative']
            .map(k => profile?.[k] ? `${k}: ${profile[k]}` : null).filter(Boolean).join('\n')
          || '(no career profile saved yet)';
        const jd = iv.job_opportunities?.job_description || '(no job description saved)';
        const { data: priorRows } = await sb.from('job_interviews').select('round,interview_type,post_interview_reflection').eq('opportunity_id', iv.opportunity_id).neq('id', ivId).not('post_interview_reflection', 'is', null);
        const priorText = (priorRows||[]).map(p => `${p.round||p.interview_type}: ${p.post_interview_reflection}`).join('\n') || '(none yet)';

        const shape = `{"top_questions":[{"category":string,"question":string,"why":string,"best_evidence":string,"answer_structure":string,"avoid":string}],"best_experience":string,"star_stories":[{"competency":string,"evidence":string,"story_angle":string}],"technical_areas":[string],"company_research_checklist":[string],"preparation_checklist":[string],"risks":[{"risk":string,"how_to_handle":string}],"questions_to_ask":[string],"intro_30s":string,"intro_60s":string,"motivation_answer":string,"confidence_note":string}`;
        const messages = [
          { role: 'system', content: `You prepare a candidate for a job interview. Return ONLY a single JSON object matching exactly this shape (no markdown, no commentary): ${shape}. Base every suggestion ONLY on the candidate's stated career profile and the job description below — never invent experience or credentials. "best_experience" names which specific stored experience to lead with. For each of top_questions, "best_evidence" must point to something actually in the career profile, and "answer_structure" is a one-line approach (e.g. "STAR: situation from X project, ..."). Keep intro_30s/intro_60s/motivation_answer in first person, ready to speak aloud. confidence_note should honestly flag if the career profile or job description was too sparse to prepare well. Use any prior-round reflections given to avoid repeating stale advice and to build on what already happened.` },
          { role: 'user', content: `CAREER PROFILE:\n${profileText}\n\nJOB DESCRIPTION (${iv.job_opportunities?.company} — ${iv.job_opportunities?.job_title}):\n${jd}\n\nINTERVIEW TYPE: ${iv.interview_type||'unspecified'}\n\nPRIOR ROUNDS FOR THIS OPPORTUNITY:\n${priorText}` },
        ];
        const reply = await chatComplete(cfg, messages, { json: true });
        const ai = JSON.parse(reply);
        const box = document.getElementById('ai-output');
        box.style.display = '';
        box.innerHTML = `
          <h4>Top Likely Questions</h4>
          ${(ai.top_questions&&ai.top_questions.length) ? ai.top_questions.map(q => `
            <details class="accordion">
              <summary><span class="q-cat">${escapeHtml(q.category)||'General'}</span><span>${escapeHtml(q.question)}</span></summary>
              <div class="accordion-body">
                <p><b>Why they may ask:</b> ${escapeHtml(q.why)}</p>
                <p><b>Your best evidence:</b> ${escapeHtml(q.best_evidence)}</p>
                <p><b>Answer structure:</b> ${escapeHtml(q.answer_structure)}</p>
                <p><b>Avoid:</b> ${escapeHtml(q.avoid)}</p>
              </div>
            </details>`).join('') : '<div style="color:var(--cl)">None.</div>'}
          <h4>Best Experience to Lead With</h4><div>${escapeHtml(ai.best_experience)||'—'}</div>
          <h4>STAR Stories to Prepare</h4>${listOrDash(ai.star_stories, s => `<b>${escapeHtml(s.competency)}:</b> ${escapeHtml(s.evidence)} — ${escapeHtml(s.story_angle)}`)}
          <h4>Technical / Business Areas to Review</h4>${listOrDash(ai.technical_areas)}
          <h4>Company Research Checklist</h4>${listOrDash(ai.company_research_checklist)}
          <h4>Preparation Checklist</h4>${listOrDash(ai.preparation_checklist)}
          <h4>Risks They May Probe</h4>${listOrDash(ai.risks, r => `<b>${escapeHtml(r.risk)}:</b> ${escapeHtml(r.how_to_handle)}`)}
          <h4>Questions to Ask Them</h4>${listOrDash(ai.questions_to_ask)}
          <h4>30-Second Introduction</h4><div>${escapeHtml(ai.intro_30s)||'—'}</div>
          <h4>60-Second Introduction</h4><div>${escapeHtml(ai.intro_60s)||'—'}</div>
          <h4>Motivation Answer</h4><div>${escapeHtml(ai.motivation_answer)||'—'}</div>
          ${ai.confidence_note ? `<h4>AI Confidence Note</h4><div style="font-style:italic;color:var(--cl);">${escapeHtml(ai.confidence_note)}</div>` : ''}
        `;
        // Pre-fill prep fields only if currently empty, so it never clobbers existing notes.
        if (!document.getElementById('f-expected_questions').value) document.getElementById('f-expected_questions').value = (ai.top_questions||[]).map(q=>`[${q.category}] ${q.question} — ${q.why}`).join('\n');
        if (!document.getElementById('f-star_stories').value) document.getElementById('f-star_stories').value = (ai.star_stories||[]).map(s=>`${s.competency}: ${s.evidence} — ${s.story_angle}`).join('\n');
        if (!document.getElementById('f-tech_prep').value) document.getElementById('f-tech_prep').value = (ai.technical_areas||[]).join('\n');
        if (!document.getElementById('f-company_research').value) document.getElementById('f-company_research').value = (ai.company_research_checklist||[]).join('\n');
        if (!document.getElementById('f-questions_to_ask').value) document.getElementById('f-questions_to_ask').value = (ai.questions_to_ask||[]).join('\n');
        if (iv.preparation_status === 'not_started') await setPrepStatus('in_progress');
        toast('AI prep ready — review below, then Save Prep to keep it.');
      } catch (e) {
        toast('AI prep failed: ' + e.message, 'err');
      } finally {
        btn.textContent = '✦ Prepare Interview with AI'; btn.disabled = false;
      }
    });

    /* ── Question log ── */
    async function loadQuestions() {
      const { data } = await sb.from('job_interview_questions').select('*').eq('interview_id', ivId).order('created_at', { ascending: false });
      document.getElementById('q-list').innerHTML = (data||[]).map(q => `<div class="q-item"><span>${escapeHtml(q.question)}</span><span style="display:flex;align-items:center;gap:8px;"><span class="q-tag">${escapeHtml(q.tag)}</span><button class="btn sm" onclick="window.deleteQuestion('${q.id}')">Del</button></span></div>`).join('') || '<div style="color:var(--cl);font-size:13px;">No questions logged yet.</div>';
    }
    document.getElementById('add-question-btn').addEventListener('click', async () => {
      const question = document.getElementById('q-question').value.trim();
      if (!question) { toast('Enter the question asked', 'err'); return; }
      const { error } = await sb.from('job_interview_questions').insert([{ interview_id: ivId, question, tag: document.getElementById('q-tag').value || null }]);
      if (error) { toast(error.message, 'err'); return; }
      document.getElementById('q-question').value = '';
      document.getElementById('q-tag').value = '';
      loadQuestions();
    });
    window.deleteQuestion = async (id) => {
      if (!confirm('Delete this logged question?')) return;
      const { error } = await sb.from('job_interview_questions').delete().eq('id', id);
      if (error) { toast(error.message, 'err'); return; }
      loadQuestions();
    };

    /* ── Self-assessment ── */
    function renderSelfAssessment() {
      const sa = iv.self_assessment || {};
      document.getElementById('self-assessment-grid').innerHTML = SELF_DIMS.map(([k,l]) => `
        <div class="self-row"><span>${l}</span>
          <select id="sa-${k}"><option value="">—</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${sa[k]==n?'selected':''}>${n}</option>`).join('')}</select>
        </div>`).join('');
    }
    document.getElementById('save-reflection-btn').addEventListener('click', async () => {
      const self_assessment = {};
      SELF_DIMS.forEach(([k]) => { const v = document.getElementById('sa-'+k).value; if (v) self_assessment[k] = +v; });
      const payload = {
        self_assessment,
        post_interview_reflection: document.getElementById('f-post_interview_reflection').value.trim() || null,
        outcome: document.getElementById('f-outcome').value.trim() || null,
      };
      const { error } = await sb.from('job_interviews').update(payload).eq('id', ivId);
      if (error) { toast(error.message, 'err'); return; }
      toast('Reflection saved');
    });

    injectRealtimeStyles();
    subscribeRealtime(sb, 'job-interviews-live', ['job_interviews','job_interview_questions'], ivId ? loadDetail : loadList, { indicatorId: 'rt-indicator' });
  </script>
</body>
</html>
