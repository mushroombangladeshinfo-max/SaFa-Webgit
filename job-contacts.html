<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Contacts — SaFa Naturals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>html.auth-checking *:not(style){visibility:hidden!important;}</style>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-size:15px;}
    :root{--bg:#060d09;--bg2:#0d1f12;--bg3:#122018;--border:rgba(255,255,255,.07);--c:#f5efe6;--cm:rgba(245,239,230,.6);--cl:rgba(245,239,230,.35);--al:#c49a3c;--green:#5fcf80;--red:#e05a2b;--blue:#50c8ff;}
    body{font-family:'DM Sans','Hind Siliguri',sans-serif;background:var(--bg);color:var(--c);min-height:100vh;margin:0;-webkit-font-smoothing:antialiased;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .page{max-width:1280px;margin:0 auto;padding:28px 24px 64px;}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
    .page-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:22px;font-weight:700;color:var(--c);margin:0 0 4px;}
    .page-sub{font-size:13px;color:var(--cl);}
    .btn{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--cl);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{color:var(--c);background:rgba(255,255,255,.08);}
    .btn.primary{background:rgba(196,154,60,.12);border-color:rgba(196,154,60,.3);color:var(--al);}
    .btn.primary:hover{background:rgba(196,154,60,.2);}
    .btn.danger{color:var(--red);border-color:rgba(224,90,43,.2);}
    .btn.sm{padding:6px 10px;font-size:8px;}
    .kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
    @media(max-width:900px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:560px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
    .kpi{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
    .kpi-label{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cl);margin-bottom:6px;}
    .kpi-val{font-family:'DM Mono','Hind Siliguri',monospace;font-size:20px;font-weight:500;color:var(--c);}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
    .filter-select,.search-input{background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--c);font-family:'DM Sans','Hind Siliguri',sans-serif;font-size:14px;padding:8px 12px;outline:none;}
    .search-input{min-width:200px;}
    .table-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .table-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cl);}
    .count-label{font-size:13px;color:var(--cl);}
    .scroll-x{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
    td{padding:12px 14px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(255,255,255,.02);}
    .empty-state{text-align:center;padding:48px 20px;color:var(--cl);}
    .empty-icon{font-size:32px;margin-bottom:10px;}
    .td-actions{display:flex;gap:6px;align-items:center;}
    .pill{display:inline-flex;padding:3px 9px;border-radius:20px;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
    .st-cold,.st-identified{background:rgba(255,255,255,.06);color:var(--cl);}
    .st-contacted,.st-responded,.st-conversation{background:rgba(80,200,255,.1);color:var(--blue);}
    .st-warm,.st-referral-requested,.st-referral-offered{background:rgba(196,154,60,.12);color:var(--al);}
    .st-referral-submitted,.st-long-term-relationship{background:rgba(95,207,128,.12);color:var(--green);}
    .job-chip{display:inline-block;font-size:11px;color:var(--cl);background:rgba(255,255,255,.05);border-radius:4px;padding:2px 7px;margin:1px 3px 1px 0;white-space:nowrap;}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
    .modal-overlay.open{display:flex;animation:fadeUp .2s ease;}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:28px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;}
    .modal-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:15px;font-weight:700;color:var(--c);margin-bottom:20px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:520px){.form-grid{grid-template-columns:1fr;}}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group.span2{grid-column:span 2;}
    label{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl);}
    input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--c);font-family:'DM Sans','Hind Siliguri',sans-serif;font-size:14px;padding:9px 12px;outline:none;width:100%;}
    input:focus,select:focus,textarea:focus{border-color:rgba(196,154,60,.5);}
    .check-row{display:flex;align-items:center;gap:8px;}
    .check-row input{width:auto;}
    .check-row label{margin:0;text-transform:none;font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:0;color:var(--cm);font-weight:400;}
    .modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
    .ai-output{background:rgba(196,154,60,.06);border:1px solid rgba(196,154,60,.2);border-radius:8px;padding:14px;margin-top:14px;font-size:13px;white-space:pre-wrap;line-height:1.6;}
    .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
    .toast{padding:12px 18px;border-radius:8px;font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;animation:fadeUp .3s ease;}
    .toast.ok{background:#1a3322;border:1px solid rgba(95,207,128,.3);color:var(--green);}
    .toast.err{background:#2a1510;border:1px solid rgba(224,90,43,.3);color:var(--red);}
  </style>
</head>
<body>

  <div class="page">
    <div class="page-header">
      <div>
        <div class="page-title">Job <span style="color:var(--al)">Contacts</span></div>
        <div class="page-sub">Recruiters, hiring managers, alumni, and everyone else in your job-search network.</div>
      </div>
      <span class="rt-indicator" id="rt-indicator"><span class="rt-dot"></span>Live</span>
      <button class="btn primary" id="add-btn">+ Add Contact</button>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Messages Sent</div><div class="kpi-val" id="kpi-sent">—</div></div>
      <div class="kpi"><div class="kpi-label">Response Rate</div><div class="kpi-val" id="kpi-rate">—</div></div>
      <div class="kpi"><div class="kpi-label">Responded</div><div class="kpi-val" id="kpi-conv">—</div></div>
      <div class="kpi"><div class="kpi-label">Referrals</div><div class="kpi-val" id="kpi-referrals">—</div></div>
      <div class="kpi"><div class="kpi-label">Follow-ups Due</div><div class="kpi-val" id="kpi-followups" style="color:var(--al);">—</div></div>
    </div>

    <div class="toolbar">
      <input type="text" class="search-input" id="search-input" placeholder="Search name or company...">
      <select class="filter-select" id="filter-type" aria-label="Filter by contact type"><option value="">All Types</option></select>
      <select class="filter-select" id="filter-stage" aria-label="Filter by relationship stage"><option value="">All Stages</option></select>
    </div>

    <div class="table-card">
      <div class="table-toolbar">
        <span class="table-title">Contacts</span>
        <span class="count-label" id="contact-count"></span>
      </div>
      <div class="scroll-x">
        <table>
          <thead><tr><th>Name</th><th>Company</th><th>Type</th><th>Stage</th><th>Related Jobs</th><th>Last Interaction</th><th>Next Follow-up</th><th></th></tr></thead>
          <tbody id="tbody"><tr><td colspan="8"><div class="empty-state"><div class="empty-icon">⏳</div>Loading...</div></td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add/Edit modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title" id="modal-title">Add Contact</div>
      <div class="form-grid">
        <div class="form-group span2"><label>Full Name *</label><input type="text" id="f-full_name"></div>
        <div class="form-group"><label>Company</label><input type="text" id="f-company"></div>
        <div class="form-group"><label>Role / Position</label><input type="text" id="f-role_position"></div>
        <div class="form-group"><label>Department</label><input type="text" id="f-department"></div>
        <div class="form-group"><label>Contact Type</label>
          <select id="f-contact_type"><option value="">Select...</option></select>
        </div>
        <div class="form-group"><label>LinkedIn URL</label><input type="url" id="f-linkedin_url"></div>
        <div class="form-group"><label>Email</label><input type="email" id="f-email"></div>
        <div class="form-group"><label>How Found</label><input type="text" id="f-how_found"></div>
        <div class="form-group"><label>Shared Institution</label><input type="text" id="f-shared_institution"></div>
        <div class="form-group"><label>Relationship Stage</label>
          <select id="f-relationship_stage"></select>
        </div>
        <div class="form-group"><label>First Contact Date</label><input type="date" id="f-first_contact_date"></div>
        <div class="form-group"><label>Last Interaction</label><input type="date" id="f-last_interaction"></div>
        <div class="form-group"><label>Next Follow-up Date</label><input type="date" id="f-next_followup_date"></div>
        <div class="form-group span2" style="flex-direction:row;gap:24px;">
          <div class="check-row"><input type="checkbox" id="f-alumni_connection"><label for="f-alumni_connection">Alumni connection</label></div>
          <div class="check-row"><input type="checkbox" id="f-referral_requested"><label for="f-referral_requested">Referral requested</label></div>
          <div class="check-row"><input type="checkbox" id="f-referral_received"><label for="f-referral_received">Referral received</label></div>
        </div>
        <div class="form-group span2"><label>Notes</label><textarea id="f-notes" rows="3"></textarea></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-save">Save Contact</button>
      </div>
    </div>
  </div>

  <!-- Draft Outreach modal -->
  <div class="modal-overlay" id="outreach-modal">
    <div class="modal">
      <div class="modal-title">✦ Draft Outreach — <span id="outreach-name"></span></div>
      <div class="form-group" style="margin-bottom:12px;">
        <label>Mode</label>
        <select id="outreach-mode">
          <option>Initial outreach</option><option>Alumni outreach</option><option>Recruiter outreach</option>
          <option>Hiring manager outreach</option><option>Referral request</option><option>Follow-up</option><option>Thank-you</option>
        </select>
      </div>
      <div class="form-group"><label>Message (edit before sending)</label><textarea id="outreach-text" rows="7" placeholder="Drafting..."></textarea></div>
      <div class="modal-actions">
        <button class="btn" id="outreach-close">Close</button>
        <button class="btn" id="outreach-regenerate">↻ Regenerate</button>
        <button class="btn primary" id="outreach-copy">Copy</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { requireAdmin }  from '/src/admin-auth.js';
    import { mountAdminNav } from '/src/admin-nav.js';
    import { loadAiCfg, chatComplete, formatAiError } from '/src/ai-client.js';
    import { localDateStr } from '/src/date-utils.js';
    import { subscribeRealtime, injectRealtimeStyles } from '/src/realtime.js';
    import { escapeHtml } from '/src/html-utils.js';
    import { CONTACT_TYPES, RELATIONSHIP_STAGES, optionsHtml } from '/src/job-constants.js';

    document.documentElement.classList.add('auth-checking');
    const sb = createClient(
      import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_ANON_KEY
    );
    const session = await requireAdmin(sb);
    if (!session) { window.location.href = 'orders.html'; }
    document.documentElement.classList.remove('auth-checking');
    mountAdminNav({ page: 'job-contacts', supabase: sb, email: session.user.email });

    document.getElementById('filter-type').innerHTML += optionsHtml(CONTACT_TYPES);
    document.getElementById('filter-stage').innerHTML += optionsHtml(RELATIONSHIP_STAGES);
    document.getElementById('f-contact_type').innerHTML += optionsHtml(CONTACT_TYPES);
    document.getElementById('f-relationship_stage').innerHTML = optionsHtml(RELATIONSHIP_STAGES, 'Identified');

    function toast(msg, type='ok') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-wrap').appendChild(el);
      setTimeout(()=>el.remove(), 3500);
    }
    function stageClass(s) { return 'st-' + (s||'cold').toLowerCase().replace(/\s+/g,'-'); }

    let _all = [], _editId = null, _relatedJobs = new Map();

    async function load() {
      const { data, error } = await sb.from('job_contacts').select('*').order('updated_at', { ascending: false });
      if (error) { toast(error.message, 'err'); return; }
      _all = data || [];
      await loadRelatedJobs();
      renderTable();
      loadNetworkingKpis();
    }

    // Contacts link to opportunities indirectly, via job_activities rows that
    // carry both contact_id and opportunity_id — there's no direct join
    // table. One batch query avoids an N+1 lookup per contact row.
    async function loadRelatedJobs() {
      _relatedJobs = new Map();
      const { data } = await sb.from('job_activities').select('contact_id, job_opportunities(company)').not('contact_id', 'is', null).not('opportunity_id', 'is', null);
      (data || []).forEach(a => {
        if (!a.job_opportunities?.company) return;
        const set = _relatedJobs.get(a.contact_id) || new Set();
        set.add(a.job_opportunities.company);
        _relatedJobs.set(a.contact_id, set);
      });
    }

    const RESPONDED_STAGES = ['Responded','Conversation','Warm','Referral Requested','Referral Offered','Referral Submitted','Long-Term Relationship'];
    async function loadNetworkingKpis() {
      const { data: acts } = await sb.from('job_activities').select('activity_type,contact_id').not('contact_id', 'is', null);
      const sent = (acts||[]).filter(a => ['LinkedIn Message','Email','Networking Meeting'].includes(a.activity_type)).length;
      // Response rate is computed from each contact's CURRENT relationship_stage
      // rather than parsing free-text activity outcomes — a contact who has
      // moved past Cold/Identified has demonstrably responded, which is more
      // robust than relying on how consistently "outcome" text was filled in.
      const contacted = _all.filter(c => !['Cold','Identified'].includes(c.relationship_stage||'Cold')).length;
      const responded = _all.filter(c => RESPONDED_STAGES.includes(c.relationship_stage)).length;
      const referrals = _all.filter(c => c.referral_received).length;
      const followupsDue = _all.filter(c => c.next_followup_date && c.next_followup_date <= localDateStr()).length;
      document.getElementById('kpi-sent').textContent = sent;
      document.getElementById('kpi-rate').textContent = contacted ? Math.round((responded/contacted)*100)+'%' : '—';
      document.getElementById('kpi-conv').textContent = responded;
      document.getElementById('kpi-referrals').textContent = referrals;
      document.getElementById('kpi-followups').textContent = followupsDue;
    }

    function filtered() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const type = document.getElementById('filter-type').value;
      const stage = document.getElementById('filter-stage').value;
      return _all.filter(c =>
        (!search || c.full_name?.toLowerCase().includes(search) || c.company?.toLowerCase().includes(search)) &&
        (!type || c.contact_type === type) &&
        (!stage || c.relationship_stage === stage)
      );
    }

    function renderTable() {
      const rows = filtered();
      document.getElementById('contact-count').textContent = `${rows.length} contact${rows.length!==1?'s':''}`;
      if (!rows.length) {
        document.getElementById('tbody').innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">🗂</div>No contacts yet — add recruiters, hiring managers, alumni and other useful professional contacts.</div></td></tr>';
        return;
      }
      document.getElementById('tbody').innerHTML = rows.map(c => `<tr>
        <td style="font-weight:600;">${escapeHtml(c.full_name)}</td>
        <td style="color:var(--cl);">${escapeHtml(c.company)||'—'}</td>
        <td style="color:var(--cl);font-size:13px;">${escapeHtml(c.contact_type)||'—'}</td>
        <td><span class="pill ${stageClass(c.relationship_stage)}">${escapeHtml(c.relationship_stage)||'Cold'}</span></td>
        <td>${[..._relatedJobs.get(c.id)||[]].map(j=>`<span class="job-chip">${escapeHtml(j)}</span>`).join('')||'<span style="color:var(--cl);font-size:12px;">—</span>'}</td>
        <td style="color:var(--cl);font-size:13px;">${c.last_interaction||'—'}</td>
        <td style="color:var(--cl);font-size:13px;">${c.next_followup_date||'—'}</td>
        <td>
          <div class="td-actions">
            <button class="btn sm" onclick="window.openOutreach('${c.id}')">✦ Outreach</button>
            <button class="btn sm" onclick="window.editContact('${c.id}')">Edit</button>
            <button class="btn danger sm" onclick="window.deleteContact('${c.id}')">Del</button>
          </div>
        </td>
      </tr>`).join('');
    }

    document.getElementById('search-input').addEventListener('input', renderTable);
    document.getElementById('filter-type').addEventListener('change', renderTable);
    document.getElementById('filter-stage').addEventListener('change', renderTable);

    /* ── Modal ── */
    const FIELDS = ['full_name','company','role_position','department','contact_type','linkedin_url','email',
      'how_found','shared_institution','relationship_stage','first_contact_date','last_interaction','next_followup_date','notes'];
    const CHECK_FIELDS = ['alumni_connection','referral_requested','referral_received'];

    function openModal(c=null) {
      _editId = c?.id || null;
      document.getElementById('modal-title').textContent = c ? 'Edit Contact' : 'Add Contact';
      FIELDS.forEach(f => { document.getElementById('f-'+f).value = c?.[f] || ''; });
      if (!c) document.getElementById('f-relationship_stage').value = 'Identified';
      CHECK_FIELDS.forEach(f => { document.getElementById('f-'+f).checked = !!c?.[f]; });
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); _editId = null; }
    document.getElementById('add-btn').addEventListener('click', () => openModal());
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

    document.getElementById('modal-save').addEventListener('click', async () => {
      const fullName = document.getElementById('f-full_name').value.trim();
      if (!fullName) { toast('Full name is required', 'err'); return; }
      const payload = {};
      FIELDS.forEach(f => { const v = document.getElementById('f-'+f).value; payload[f] = (typeof v === 'string' ? v.trim() : v) || null; });
      payload.full_name = fullName;
      CHECK_FIELDS.forEach(f => { payload[f] = document.getElementById('f-'+f).checked; });

      let error;
      if (_editId) ({ error } = await sb.from('job_contacts').update(payload).eq('id', _editId));
      else ({ error } = await sb.from('job_contacts').insert([payload]));
      if (error) { toast(error.message, 'err'); return; }
      toast(_editId ? 'Contact updated' : 'Contact added');
      closeModal();
      load();
    });

    window.editContact = (id) => openModal(_all.find(c => c.id === id));
    window.deleteContact = async (id) => {
      if (!confirm('Delete this contact?')) return;
      const { error } = await sb.from('job_contacts').delete().eq('id', id);
      if (error) { toast(error.message, 'err'); return; }
      toast('Deleted');
      load();
    };

    /* ── Draft Outreach (AI) ── */
    let _outreachContact = null;
    async function draftOutreach() {
      const ta = document.getElementById('outreach-text');
      ta.value = ''; ta.placeholder = 'Drafting...';
      const cfg = await loadAiCfg(sb);
      if (cfg.provider === 'openai' && !cfg.key) { ta.placeholder = 'Configure a Groq key on the Home page first.'; return; }
      const c = _outreachContact;
      const mode = document.getElementById('outreach-mode').value;
      const messages = [
        { role: 'system', content: `You draft short, concise, human-sounding professional networking messages (LinkedIn/email) for a job seeker reaching out to a professional contact. Mode: "${mode}". Use ONLY the facts given below about the contact — never invent a shared connection, mutual acquaintance, or detail not provided. Avoid generic filler like "I came across your impressive profile." Keep it grounded, specific, and brief (3-5 sentences). Output only the message text.` },
        { role: 'user', content: `Contact: ${c.full_name}\nRole: ${c.role_position||'unknown'}\nCompany: ${c.company||'unknown'}\nContact type: ${c.contact_type||'unknown'}\nHow found: ${c.how_found||'unknown'}\nShared institution: ${c.shared_institution||'none stated'}\nAlumni connection: ${c.alumni_connection?'yes':'no'}\nRelationship stage: ${c.relationship_stage||'Cold'}` },
      ];
      try {
        const reply = await chatComplete(cfg, messages);
        ta.value = reply.trim();
      } catch (e) {
        ta.placeholder = formatAiError(cfg, e).replace(/\*\*/g, '');
      }
    }
    window.openOutreach = function(id) {
      _outreachContact = _all.find(c => c.id === id);
      document.getElementById('outreach-name').textContent = _outreachContact.full_name;
      document.getElementById('outreach-modal').classList.add('open');
      draftOutreach();
    };
    document.getElementById('outreach-close').addEventListener('click', () => document.getElementById('outreach-modal').classList.remove('open'));
    document.getElementById('outreach-modal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });
    document.getElementById('outreach-regenerate').addEventListener('click', draftOutreach);
    document.getElementById('outreach-mode').addEventListener('change', draftOutreach);
    document.getElementById('outreach-copy').addEventListener('click', () => {
      const text = document.getElementById('outreach-text').value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => toast('Copied to clipboard'));
    });

    if (new URLSearchParams(location.search).get('new') === '1') openModal();
    load();
    injectRealtimeStyles();
    subscribeRealtime(sb, 'job-contacts-live', ['job_contacts','job_activities'], load, { indicatorId: 'rt-indicator' });
  </script>
</body>
</html>
