<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Copilot — SaFa Naturals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>html.auth-checking *:not(style){visibility:hidden!important;}</style>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-size:15px;}
    :root{--bg:#060d09;--bg2:#0d1f12;--bg3:#122018;--border:rgba(255,255,255,.07);--c:#f5efe6;--cm:rgba(245,239,230,.6);--cl:rgba(245,239,230,.35);--al:#c49a3c;--green:#5fcf80;--red:#e05a2b;}
    body{font-family:'DM Sans','Hind Siliguri',sans-serif;background:var(--bg);color:var(--c);min-height:100vh;margin:0;-webkit-font-smoothing:antialiased;}
    .page{max-width:820px;margin:0 auto;padding:28px 24px 32px;height:calc(100vh - 56px);display:flex;flex-direction:column;}
    .page-header{margin-bottom:16px;}
    .page-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:22px;font-weight:700;color:var(--c);margin:0 0 4px;}
    .page-sub{font-size:13px;color:var(--cl);}
    .quick-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .quick-btn{font-family:'DM Sans',sans-serif;font-size:12px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(196,154,60,.06);color:var(--al);cursor:pointer;}
    .quick-btn:hover{background:rgba(196,154,60,.12);}
    .chat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;}
    .chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
    .ai-msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;}
    .ai-msg-user{align-self:flex-end;background:var(--al);color:var(--bg);border-bottom-right-radius:3px;}
    .ai-msg-assistant{align-self:flex-start;background:var(--bg3);color:var(--cm);border:1px solid var(--border);border-bottom-left-radius:3px;}
    .ai-msg-assistant strong{color:var(--c);}
    .ai-msg-error{align-self:flex-start;background:rgba(224,90,43,.1);color:var(--red);border:1px solid rgba(224,90,43,.25);font-size:12.5px;}
    .ai-empty{text-align:center;padding:40px 14px;color:var(--cl);font-size:13px;}
    .ai-typing{display:flex;gap:4px;padding:0 16px 10px;flex-shrink:0;}
    .ai-typing.hidden{display:none;}
    .ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--cl);animation:aiBounce 1.2s infinite;}
    .ai-typing span:nth-child(2){animation-delay:.2s;} .ai-typing span:nth-child(3){animation-delay:.4s;}
    @keyframes aiBounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
    .chat-input-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border);flex-shrink:0;}
    .chat-input-row textarea{flex:1;resize:none;background:var(--bg3);border:1px solid var(--border);color:var(--c);border-radius:8px;padding:9px 12px;font-size:13.5px;font-family:inherit;max-height:100px;outline:none;}
    .chat-input-row textarea:focus{border-color:rgba(196,154,60,.4);}
    .chat-send{background:var(--al);color:var(--bg);border:none;width:38px;height:38px;border-radius:8px;cursor:pointer;flex-shrink:0;font-size:16px;font-family:'Syne',sans-serif;font-weight:700;}
    .chat-send:disabled{opacity:.5;cursor:not-allowed;}
    .header-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
    .btn{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--cl);cursor:pointer;}
    .btn:hover{color:var(--c);background:rgba(255,255,255,.08);}
    .btn.primary{background:rgba(196,154,60,.12);border-color:rgba(196,154,60,.3);color:var(--al);}
    .btn.primary:hover{background:rgba(196,154,60,.2);}
    .btn.sm{padding:6px 10px;font-size:8px;}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px;}
    .form-group{margin-bottom:14px;}
    .form-group label{display:block;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl);margin-bottom:6px;}
    .form-group textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--c);font-family:'DM Sans','Hind Siliguri',sans-serif;font-size:13.5px;padding:9px 12px;outline:none;resize:vertical;}
    .form-group textarea:focus{border-color:rgba(196,154,60,.5);}
    .modal-actions{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;}
    .interpret-spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(196,154,60,.25);border-top-color:var(--al);border-radius:50%;animation:iSpin .7s linear infinite;vertical-align:-1px;margin-right:6px;}
    @keyframes iSpin{to{transform:rotate(360deg);}}
    .update-review{background:rgba(196,154,60,.06);border:1px solid rgba(196,154,60,.2);border-radius:8px;padding:14px;margin-top:14px;}
    .update-review-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:13px;font-weight:700;color:var(--c);margin-bottom:2px;}
    .update-review-sub{font-size:11.5px;color:var(--cl);margin-bottom:10px;}
    .diff-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;}
    .diff-row:last-child{border-bottom:none;}
    .diff-label{color:var(--cl);}
    .diff-val{color:var(--c);font-weight:500;text-align:right;}
    .unclear-note{font-size:11.5px;color:var(--cl);font-style:italic;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);}
    .no-match-note{font-size:13px;color:var(--cl);margin-top:14px;}
    .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
    .toast{padding:12px 18px;border-radius:8px;font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
    .toast.ok{background:#1a3322;border:1px solid rgba(95,207,128,.3);color:var(--green);}
    .toast.err{background:#2a1510;border:1px solid rgba(224,90,43,.3);color:var(--red);}
  </style>
</head>
<body>

  <div class="page">
    <div class="page-header header-row">
      <div>
        <div class="page-title">AI <span style="color:var(--al)">Copilot</span></div>
        <div class="page-sub">Ask about your pipeline, priorities, or any opportunity — grounded in your actual tracker data.</div>
      </div>
      <button class="btn primary" id="log-update-btn">📝 Log an Update</button>
    </div>
    <div id="profile-bar"></div>
    <div class="quick-row">
      <button class="quick-btn" data-q="What should I do today?">What should I do today?</button>
      <button class="quick-btn" data-q="Which jobs should I prioritize right now?">Which jobs should I prioritize?</button>
      <button class="quick-btn" data-q="Analyse my pipeline — where is it working, and where is it weak?">Analyse my pipeline</button>
    </div>
    <div class="chat-card">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="ai-typing hidden" id="ai-typing"><span></span><span></span><span></span></div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="1" placeholder="Ask anything about your job search..."></textarea>
        <button class="chat-send" id="chat-send">↑</button>
      </div>
    </div>
  </div>

  <!-- Log an Update modal: natural-language tracker update. Two steps —
       interpret (AI proposes changes to an EXISTING opportunity/interview,
       never creates a new one) then a review card the user must confirm
       before anything is written. -->
  <div class="modal-overlay" id="update-modal">
    <div class="modal">
      <div class="modal-title">Log an Update</div>
      <div class="form-group">
        <label for="update-input">What happened?</label>
        <textarea id="update-input" rows="4" placeholder="e.g. I applied to Bosch today using CV Analytics v2.1"></textarea>
      </div>
      <div id="update-status" style="font-size:12px;color:var(--cl);min-height:16px;"></div>
      <div id="update-review" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn" id="update-modal-cancel">Cancel</button>
        <button class="btn primary" id="interpret-btn">Interpret</button>
        <button class="btn primary" id="confirm-update-btn" style="display:none;">Confirm &amp; Update</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    import { requireAdmin }  from '/src/admin-auth.js';
    import { mountAdminNav } from '/src/admin-nav.js';
    import { loadAiCfg, chatComplete, formatAiError, renderAiText } from '/src/ai-client.js';
    import { localDateStr } from '/src/date-utils.js';
    import { computeFitScore, computePriority, followUpStatus, computeDerivedFields } from '/src/job-scoring.js';
    import { escapeHtml } from '/src/html-utils.js';
    import { STAGE_LABEL, STAGE_ORDER, ACTIVITY_TYPES, QUESTION_TAGS } from '/src/job-constants.js';
    import { ensureActiveProfileId, renderProfileSwitcher } from '/src/job-profile.js';

    document.documentElement.classList.add('auth-checking');
    const sb = createClient(
      import.meta.env.VITE_SUPABASE_URL,
      import.meta.env.VITE_SUPABASE_ANON_KEY
    );
    const session = await requireAdmin(sb);
    if (!session) { window.location.href = 'orders.html'; }
    document.documentElement.classList.remove('auth-checking');
    mountAdminNav({ page: 'job-copilot', supabase: sb, email: session.user.email });

    let profileId = null;
    let messages = JSON.parse(sessionStorage.getItem('jobCopilotHistory') || '[]');

    function persist() { sessionStorage.setItem('jobCopilotHistory', JSON.stringify(messages)); }
    function renderMessages() {
      const el = document.getElementById('chat-messages');
      el.innerHTML = messages.length
        ? messages.map(m => `<div class="ai-msg ai-msg-${m.role}">${renderAiText(m.content)}</div>`).join('')
        : `<div class="ai-empty">Ask about today's priorities, a specific opportunity, or your overall pipeline — answers are grounded in your real tracker data, never invented.</div>`;
      el.scrollTop = el.scrollHeight;
    }
    function renderError(text) {
      const el = document.getElementById('chat-messages');
      el.insertAdjacentHTML('beforeend', `<div class="ai-msg ai-msg-error">${renderAiText(text)}</div>`);
      el.scrollTop = el.scrollHeight;
    }

    /* Small, current snapshot of the tracker — same context-stuffing pattern
       as home.html's SaFa Assistant, scoped to job-search data. */
    async function buildSnapshot() {
      const [{ data: opps }, { data: interviews }, { data: profile }, { data: offers }] = await Promise.all([
        sb.from('job_opportunities').select('*').eq('profile_id', profileId).eq('closed', false),
        sb.from('job_interviews').select('*, job_opportunities(company,job_title)').eq('profile_id', profileId).eq('status', 'scheduled'),
        sb.from('job_profiles').select('status,target_roles,target_locations,career_preferences,structured_profile,strategy_json').eq('id', profileId).maybeSingle(),
        sb.from('job_offers').select('*, job_opportunities(company,job_title)').eq('profile_id', profileId).in('status', ['pending','negotiating']),
      ]);
      const today = localDateStr();
      const opportunities = (opps||[]).map(o => ({
        company: o.company, title: o.job_title, stage: o.stage,
        fit: computeFitScore(o.fit_manual, o.fit_ai), priority: computePriority(o).label,
        applied: o.applied, deadline: o.application_deadline,
        next_action: o.next_action, next_action_date: o.next_action_date,
        follow_up_status: followUpStatus(o.next_action_date),
      }));
      const upcomingInterviews = (interviews||[]).map(iv => ({
        company: iv.job_opportunities?.company, title: iv.job_opportunities?.job_title,
        round: iv.round, type: iv.interview_type, date: iv.interview_date,
      }));
      const pendingOffers = (offers||[]).map(o => ({
        company: o.job_opportunities?.company, title: o.job_opportunities?.job_title,
        base_salary_eur: o.base_salary, status: o.status, response_deadline: o.response_deadline,
      }));
      // Once the Career Diagnostic is confirmed, strategy_json's
      // recommended path / immediate priorities / avoid-for-now are
      // exactly the kind of grounded answer this copilot should be
      // drawing on for "what should I do next" — not just the three flat
      // preference fields it used to see. Degrade gracefully (rather than
      // refusing to chat at all) when the profile isn't confirmed yet,
      // since this is a general assistant, not a single job-fit verdict.
      const careerContext = profile?.status === 'confirmed'
        ? {
            confirmed: true,
            primary_target_role: profile.structured_profile?.primaryTargetRole || null,
            secondary_target_roles: profile.structured_profile?.secondaryTargetRoles || [],
            career_priorities: profile.structured_profile?.careerPriorities || [],
            recommended_primary_path: profile.strategy_json?.recommendedPrimaryPath || null,
            secondary_path: profile.strategy_json?.secondaryPath || null,
            immediate_priorities: profile.strategy_json?.immediatePriorities || [],
            avoid_for_now: profile.strategy_json?.avoidForNow || [],
          }
        : {
            confirmed: false,
            note: 'Career Profile diagnostic not yet confirmed on the Career Profile page — target roles/strategy below may be incomplete or stale.',
            target_roles: profile?.target_roles || null,
            target_locations: profile?.target_locations || null,
            career_preferences: profile?.career_preferences || null,
          };
      return { today, career_context: careerContext, active_opportunities: opportunities, upcoming_interviews: upcomingInterviews, pending_offers: pendingOffers };
    }

    function systemPrompt(snap) {
      return `You are a personal AI copilot for a job search tracker (a "Job Search Command Center"). You help the user decide what to do next to increase their chances of getting a job.

Live snapshot (JSON) of their current tracker data:
${JSON.stringify(snap)}

Rules: use ONLY the data given above — never invent a job, contact, deadline, or fact not present in the snapshot. If something isn't in the snapshot, say so plainly rather than guessing. Distinguish facts (directly in the data) from your own recommendations. Keep answers concrete and specific — name real companies/jobs from the snapshot when relevant. Be direct and conversational, not a formal report.`;
    }

    async function send(text) {
      text = text.trim();
      if (!text) return;
      const cfg = await loadAiCfg(sb);
      messages.push({ role: 'user', content: text });
      renderMessages();
      persist();

      if (cfg.provider === 'openai' && !cfg.key) {
        renderError('**API key needed.** Configure a Groq key on the Home page AI settings first.');
        return;
      }

      document.getElementById('ai-typing').classList.remove('hidden');
      document.getElementById('chat-send').disabled = true;
      try {
        const snap = await buildSnapshot();
        const payload = [{ role: 'system', content: systemPrompt(snap) }, ...messages];
        const reply = await chatComplete(cfg, payload);
        messages.push({ role: 'assistant', content: reply });
        renderMessages();
        persist();
      } catch (e) {
        renderError(formatAiError(cfg, e));
      } finally {
        document.getElementById('ai-typing').classList.add('hidden');
        document.getElementById('chat-send').disabled = false;
      }
    }

    document.getElementById('chat-send').addEventListener('click', () => {
      const input = document.getElementById('chat-input');
      send(input.value);
      input.value = '';
    });
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('chat-send').click();
      }
    });
    document.querySelectorAll('.quick-btn').forEach(b => b.addEventListener('click', () => send(b.dataset.q)));

    /* ── Log an Update: natural-language tracker update ──
       Two steps — interpret (AI proposes changes to an EXISTING
       opportunity/interview, grounded only in ids we actually hand it, and
       never creates a new opportunity — that's what AI Import is for) then
       a review card the user must confirm before anything is written. */
    let _pendingUpdate = null;

    function openUpdateModal() {
      document.getElementById('update-input').value = '';
      document.getElementById('update-status').textContent = '';
      document.getElementById('update-review').style.display = 'none';
      document.getElementById('confirm-update-btn').style.display = 'none';
      document.getElementById('interpret-btn').style.display = '';
      _pendingUpdate = null;
      document.getElementById('update-modal').classList.add('open');
    }
    function closeUpdateModal() { document.getElementById('update-modal').classList.remove('open'); }
    document.getElementById('log-update-btn').addEventListener('click', openUpdateModal);
    document.getElementById('update-modal-cancel').addEventListener('click', closeUpdateModal);
    document.getElementById('update-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeUpdateModal(); });

    document.getElementById('interpret-btn').addEventListener('click', async () => {
      const text = document.getElementById('update-input').value.trim();
      if (!text) { toast('Describe what happened first', 'err'); return; }
      const statusEl = document.getElementById('update-status');
      const btn = document.getElementById('interpret-btn');
      statusEl.innerHTML = '<span class="interpret-spinner"></span>Interpreting — matching against your tracker...';
      btn.disabled = true;
      document.getElementById('update-review').style.display = 'none';
      document.getElementById('confirm-update-btn').style.display = 'none';

      try {
        const cfg = await loadAiCfg(sb);
        if (cfg.provider === 'openai' && !cfg.key) { statusEl.textContent = 'Configure a Groq key on the Home page first.'; return; }

        const [{ data: opps }, { data: interviews }] = await Promise.all([
          sb.from('job_opportunities').select('id,company,job_title,stage').eq('profile_id', profileId).eq('closed', false),
          sb.from('job_interviews').select('id,opportunity_id,round,interview_date,status,job_opportunities(company,job_title)')
            .eq('profile_id', profileId)
            .or(`status.eq.scheduled,and(status.eq.completed,post_interview_reflection.is.null)`),
        ]);
        const oppList = (opps||[]).map(o => ({ id: o.id, company: o.company, job_title: o.job_title, stage: o.stage }));
        const ivList = (interviews||[]).map(iv => ({ id: iv.id, opportunity_id: iv.opportunity_id, company: iv.job_opportunities?.company, job_title: iv.job_opportunities?.job_title, round: iv.round, interview_date: iv.interview_date, status: iv.status }));
        const validOppIds = new Set(oppList.map(o=>o.id));
        const validIvIds = new Set(ivList.map(iv=>iv.id));

        const shape = `{"matched_opportunity_id":"uuid|null","matched_interview_id":"uuid|null","summary":string,"opportunity_updates":{"stage":${JSON.stringify(STAGE_ORDER)}[number]|null,"applied":boolean|null,"applied_date":"YYYY-MM-DD"|null,"cv_version":string|null,"next_action":string|null,"next_action_date":"YYYY-MM-DD"|null},"interview_updates":{"status":"completed"|"cancelled"|null,"outcome":string|null,"post_interview_reflection":string|null},"new_interview_questions":[{"question":string,"tag":${JSON.stringify(QUESTION_TAGS)}[number]|null}],"activity_type":${JSON.stringify(ACTIVITY_TYPES)}[number],"activity_date":"YYYY-MM-DD","unclear_notes":"string|null"}`;
        const messages = [
          { role: 'system', content: `You interpret a short free-text update from a job seeker about something that happened in their job search, and turn it into structured updates to their EXISTING tracker records. Return ONLY a single JSON object matching exactly this shape (no markdown, no commentary): ${shape}.

Rules: matched_opportunity_id and matched_interview_id must be one of the exact ids given below, or null — never invent an id, never guess if genuinely unsure which record is meant. Only fill in a field under opportunity_updates/interview_updates if the message actually implies that change; leave everything else null. For a vague or relative date ("next week", "soon"), leave the date field null and mention it in unclear_notes instead of guessing a specific date — today's date is given below. new_interview_questions should only contain questions the message says were actually asked. This flow only updates existing records — it never creates a new opportunity.` },
          { role: 'user', content: `TODAY: ${localDateStr()}\n\nACTIVE OPPORTUNITIES:\n${JSON.stringify(oppList)}\n\nOPEN INTERVIEWS:\n${JSON.stringify(ivList)}\n\nUSER'S UPDATE:\n${text}` },
        ];
        const reply = await chatComplete(cfg, messages, { json: true });
        const parsed = JSON.parse(reply);

        // Defense in depth: never trust an id or enum value the model
        // returns without checking it against what was actually offered —
        // a CHECK constraint would catch a bad enum at save time anyway,
        // but this gives a cleaner message instead of a raw Postgres error.
        if (parsed.matched_opportunity_id && !validOppIds.has(parsed.matched_opportunity_id)) parsed.matched_opportunity_id = null;
        if (parsed.matched_interview_id && !validIvIds.has(parsed.matched_interview_id)) parsed.matched_interview_id = null;
        if (parsed.opportunity_updates?.stage && !STAGE_ORDER.includes(parsed.opportunity_updates.stage)) parsed.opportunity_updates.stage = null;
        if (parsed.activity_type && !ACTIVITY_TYPES.includes(parsed.activity_type)) parsed.activity_type = null;
        (parsed.new_interview_questions||[]).forEach(q => { if (q.tag && !QUESTION_TAGS.includes(q.tag)) q.tag = null; });

        if (!parsed.matched_opportunity_id && !parsed.matched_interview_id) {
          statusEl.textContent = '';
          const review = document.getElementById('update-review');
          review.style.display = '';
          review.innerHTML = `<div class="no-match-note">Couldn't confidently match this to an existing opportunity or interview — nothing has been changed. Try naming the company more explicitly, or log it manually on the Opportunities/Interviews page.${parsed.unclear_notes ? '<div class="unclear-note">'+escapeHtml(parsed.unclear_notes)+'</div>' : ''}</div>`;
          _pendingUpdate = null;
          return;
        }

        // An interview-only match still belongs to an opportunity — without
        // this, the logged activity would carry no opportunity_id and
        // silently never show up on that opportunity's Activity timeline.
        const matchedIv = parsed.matched_interview_id ? ivList.find(i=>i.id===parsed.matched_interview_id) : null;
        parsed._effective_opportunity_id = parsed.matched_opportunity_id || matchedIv?.opportunity_id || null;

        _pendingUpdate = parsed;
        await renderUpdateReview(parsed, oppList, ivList);
        statusEl.textContent = '';
        document.getElementById('confirm-update-btn').style.display = '';
        btn.style.display = 'none';
      } catch (e) {
        statusEl.textContent = 'Interpretation failed: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    });

    async function renderUpdateReview(parsed, oppList, ivList) {
      const opp = parsed.matched_opportunity_id ? oppList.find(o=>o.id===parsed.matched_opportunity_id) : null;
      const iv = parsed.matched_interview_id ? ivList.find(i=>i.id===parsed.matched_interview_id) : null;
      const title = opp ? `${opp.company} — ${opp.job_title}` : iv ? `${iv.company} — ${iv.round||'Interview'}` : 'Unmatched';

      const rows = [];
      const ou = parsed.opportunity_updates || {};
      if (ou.stage) rows.push(['Stage', STAGE_LABEL[ou.stage] || ou.stage]);
      if (ou.applied) rows.push(['Applied', 'Yes' + (ou.applied_date ? ' ('+ou.applied_date+')' : '')]);
      if (ou.cv_version) rows.push(['CV Version', ou.cv_version]);
      if (ou.next_action) rows.push(['Next Action', ou.next_action + (ou.next_action_date ? ' — '+ou.next_action_date : '')]);
      const iu = parsed.interview_updates || {};
      if (iu.status) rows.push(['Interview Status', iu.status]);
      if (iu.outcome) rows.push(['Outcome', iu.outcome]);
      if (iu.post_interview_reflection) rows.push(['Reflection', iu.post_interview_reflection]);
      if (parsed.new_interview_questions?.length) rows.push(['Questions Logged', String(parsed.new_interview_questions.length)]);
      rows.push(['New Activity', parsed.summary || '—']);

      const review = document.getElementById('update-review');
      review.style.display = '';
      review.innerHTML = `<div class="update-review">
        <div class="update-review-title">${escapeHtml(title)}</div>
        <div class="update-review-sub">Proposed changes — review before confirming</div>
        ${rows.map(([l,v]) => `<div class="diff-row"><span class="diff-label">${escapeHtml(l)}</span><span class="diff-val">${escapeHtml(v)}</span></div>`).join('')}
        ${parsed.unclear_notes ? `<div class="unclear-note">${escapeHtml(parsed.unclear_notes)}</div>` : ''}
      </div>`;
    }

    document.getElementById('confirm-update-btn').addEventListener('click', async () => {
      if (!_pendingUpdate) return;
      const p = _pendingUpdate;
      const btn = document.getElementById('confirm-update-btn');
      btn.disabled = true;
      try {
        if (p.matched_opportunity_id && p.opportunity_updates) {
          const payload = {};
          Object.entries(p.opportunity_updates).forEach(([k,v]) => { if (v !== null && v !== undefined) payload[k] = v; });
          if (Object.keys(payload).length) {
            // applied/applied_date affect priority's deadline-urgency
            // component, so recompute the derived fields against the full
            // current row + this diff — not just the diff in isolation.
            const { data: currentOpp } = await sb.from('job_opportunities').select('*').eq('id', p.matched_opportunity_id).maybeSingle();
            if (currentOpp) Object.assign(payload, computeDerivedFields({ ...currentOpp, ...payload }));
            const { error } = await sb.from('job_opportunities').update(payload).eq('id', p.matched_opportunity_id);
            if (error) throw error;
          }
        }
        if (p.matched_interview_id && p.interview_updates) {
          const payload = {};
          Object.entries(p.interview_updates).forEach(([k,v]) => { if (v !== null && v !== undefined) payload[k] = v; });
          if (Object.keys(payload).length) {
            const { error } = await sb.from('job_interviews').update(payload).eq('id', p.matched_interview_id);
            if (error) throw error;
          }
        }
        if (p.matched_interview_id && p.new_interview_questions?.length) {
          const rows = p.new_interview_questions.filter(q=>q.question).map(q => ({ interview_id: p.matched_interview_id, question: q.question, tag: q.tag || null }));
          if (rows.length) {
            const { error } = await sb.from('job_interview_questions').insert(rows);
            if (error) throw error;
          }
        }
        const { error: actErr } = await sb.from('job_activities').insert([{
          profile_id: profileId,
          opportunity_id: p._effective_opportunity_id || null,
          activity_type: p.activity_type || 'Other',
          activity_date: p.activity_date || localDateStr(),
          summary: p.summary || null,
        }]);
        if (actErr) throw actErr;

        toast('Tracker updated');
        // Land on a link to what just changed instead of just closing —
        // "updated" isn't very actionable without a way to go see it.
        const link = p.matched_interview_id
          ? `job-interviews.html?id=${p.matched_interview_id}`
          : p._effective_opportunity_id ? `job-opportunity.html?id=${p._effective_opportunity_id}` : null;
        document.getElementById('update-review').innerHTML = `<div class="update-review">
          <div class="update-review-title">✓ Updated</div>
          <div class="update-review-sub">${escapeHtml(p.summary || '')}</div>
          ${link ? `<a href="${link}" class="btn primary sm" style="text-decoration:none;display:inline-block;margin-top:8px;">View ${p.matched_interview_id ? 'Interview' : 'Opportunity'} →</a>` : ''}
        </div>`;
        document.getElementById('confirm-update-btn').style.display = 'none';
        _pendingUpdate = null;
      } catch (e) {
        toast('Update failed: ' + e.message, 'err');
      } finally {
        btn.disabled = false;
      }
    });

    function toast(msg, type='ok') {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-wrap').appendChild(el);
      setTimeout(()=>el.remove(), 3500);
    }

    profileId = await ensureActiveProfileId(sb);
    renderProfileSwitcher(sb, document.getElementById('profile-bar'), async () => { profileId = await ensureActiveProfileId(sb); });
    renderMessages();
    // Lets the Dashboard's "Log an Update" quick action jump straight into
    // the modal instead of landing here and making the user find the
    // button themselves.
    if (new URLSearchParams(location.search).get('logUpdate') === '1') openUpdateModal();
  </script>
</body>
</html>
