<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interviews — SaFa Naturals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>html.auth-checking *:not(style){visibility:hidden!important;}</style>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    html{font-size:15px;}
    :root{--bg:#060d09;--bg2:#0d1f12;--bg3:#122018;--border:rgba(255,255,255,.07);--c:#f5efe6;--cm:rgba(245,239,230,.6);--cl:rgba(245,239,230,.35);--al:#c49a3c;--green:#5fcf80;--red:#e05a2b;--blue:#50c8ff;}
    body{font-family:'DM Sans','Hind Siliguri',sans-serif;background:var(--bg);color:var(--c);min-height:100vh;margin:0;-webkit-font-smoothing:antialiased;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .page{max-width:1000px;margin:0 auto;padding:28px 24px 64px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--cl);text-decoration:none;font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;}
    .back-link:hover{color:var(--c);}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
    .page-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:22px;font-weight:700;color:var(--c);margin:0 0 4px;}
    .page-sub{font-size:13px;color:var(--cl);}
    .btn{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:6px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--cl);cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
    .btn:hover{color:var(--c);background:rgba(255,255,255,.08);}
    .btn.primary{background:rgba(196,154,60,.12);border-color:rgba(196,154,60,.3);color:var(--al);}
    .btn.primary:hover{background:rgba(196,154,60,.2);}
    .btn.sm{padding:6px 10px;font-size:8px;}
    .table-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);}
    .table-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cl);}
    .scroll-x{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th{font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
    td{padding:12px 14px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:rgba(255,255,255,.02);}
    .empty-state{text-align:center;padding:48px 20px;color:var(--cl);}
    .empty-icon{font-size:32px;margin-bottom:10px;}
    .pill{display:inline-flex;padding:3px 9px;border-radius:20px;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
    .pill-scheduled{background:rgba(80,200,255,.1);color:var(--blue);}
    .pill-completed{background:rgba(95,207,128,.12);color:var(--green);}
    .pill-cancelled{background:rgba(255,255,255,.05);color:var(--cl);}
    #f-preparation_status{border-radius:20px;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--border);background:var(--bg2);color:var(--cl);cursor:pointer;}
    #f-preparation_status.prep-in_progress{background:rgba(196,154,60,.12);color:var(--al);border-color:rgba(196,154,60,.3);}
    #f-preparation_status.prep-ready{background:rgba(95,207,128,.12);color:var(--green);border-color:rgba(95,207,128,.3);}
    .accordion{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;}
    .accordion summary{padding:10px 12px;cursor:pointer;font-size:13px;list-style:none;display:flex;gap:10px;align-items:center;}
    .accordion summary::-webkit-details-marker{display:none;}
    .accordion summary .q-cat{font-family:'Syne',sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--al);background:rgba(196,154,60,.1);padding:2px 7px;border-radius:4px;flex-shrink:0;}
    .accordion-body{padding:0 12px 12px;font-size:12.5px;color:var(--cm);line-height:1.6;}
    .accordion-body p{margin:4px 0;}
    .row-link{color:inherit;text-decoration:none;}
    .row-link:hover .iv-company{color:var(--al);}

    .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;}
    .card-title{font-family:'Syne','Hind Siliguri',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--al);margin-bottom:14px;}
    label.f{display:block;font-family:'Syne','Hind Siliguri',sans-serif;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cl);margin-bottom:6px;}
    input,select,textarea{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--c);font-family:'DM Sans','Hind Siliguri',sans-serif;font-size:14px;padding:9px 12px;outline:none;width:100%;}
    input:focus,select:focus,textarea:focus{border-color:rgba(196,154,60,.5);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
    .form-group.span2{grid-column:span 2;}
    .ai-output{background:rgba(196,154,60,.06);border:1px solid rgba(196,154,60,.2);border-radius:8px;padding:16px;margin-top:14px;font-size:13px;line-height:1.6;}
    .ai-output h4{font-family:'Syne',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--al);margin:14px 0 4px;}
    .ai-output h4:first-child{margin-top:0;}
    .ai-output ul{margin:4px 0;padding-left:18px;}
    .self-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;}
    @media(max-width:600px){.self-grid{grid-template-columns:1fr;}}
    .self-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--cm);}
    .self-row select{width:70px;}
    .q-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;}
    .q-tag{font-size:10px;color:var(--cl);text-transform:uppercase;}

    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
    .modal-overlay.open{display:flex;animation:fadeUp .2s ease;}
    .modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:26px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;}
    .modal-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px;}
    .modal-actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}

    .toast-wrap{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;}
    .toast{padding:12px 18px;border-radius:8px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;animation:fadeUp .3s ease;}
    .toast.ok{background:#1a3322;border:1px solid rgba(95,207,128,.3);color:var(--green);}
    .toast.err{background:#2a1510;border:1px solid rgba(224,90,43,.3);color:var(--red);}
  </style>
  <script type="module" crossorigin src="/assets/jobInterviews-DR-Hs4mr.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-auth-4ZiUUGs_.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-nav-DwveRXqR.js">
  <link rel="modulepreload" crossorigin href="/assets/ai-client-Ym7whptS.js">
  <link rel="modulepreload" crossorigin href="/assets/date-utils-D3sh9T8I.js">
  <link rel="modulepreload" crossorigin href="/assets/realtime-D7K--cdb.js">
  <link rel="modulepreload" crossorigin href="/assets/job-constants-CRXIg69m.js">
</head>
<body>

  <div class="page">
    <!-- List view -->
    <div id="list-view">
      <div class="page-header">
        <div>
          <div class="page-title">Job <span style="color:var(--al)">Interviews</span></div>
          <div class="page-sub">Every round, tracked with prep, self-assessment, and question history.</div>
        </div>
        <span class="rt-indicator" id="rt-indicator"><span class="rt-dot"></span>Live</span>
        <button class="btn primary" id="add-btn">+ Schedule Interview</button>
      </div>
      <div class="table-card">
        <div class="table-toolbar"><span class="table-title">Interviews</span><span class="count-label" id="iv-count" style="font-size:13px;color:var(--cl);"></span></div>
        <div class="scroll-x">
          <table>
            <thead><tr><th>Company / Role</th><th>Round</th><th>Type</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="tbody"><tr><td colspan="5"><div class="empty-state"><div class="empty-icon">⏳</div>Loading...</div></td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Detail / prep view -->
    <div id="detail-view" style="display:none;">
      <a href="job-interviews.html" class="back-link">← All Interviews</a>
      <div class="page-header">
        <div>
          <div class="page-title" id="dv-title">—</div>
          <div class="page-sub" id="dv-sub"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="f-preparation_status" aria-label="Preparation status"></select>
          <button class="btn primary" id="ai-prep-btn">✦ Prepare Interview with AI</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Logistics</div>
        <div class="form-grid">
          <div class="form-group"><label class="f">Round</label><input type="text" id="f-round"></div>
          <div class="form-group"><label class="f">Type</label>
            <select id="f-interview_type"><option value="">Select...</option></select>
          </div>
          <div class="form-group"><label class="f">Date</label><input type="date" id="f-interview_date"></div>
          <div class="form-group"><label class="f">Time</label><input type="text" id="f-interview_time"></div>
          <div class="form-group"><label class="f">Duration (min)</label><input type="number" id="f-duration_minutes" min="0"></div>
          <div class="form-group"><label class="f">Interviewers</label><input type="text" id="f-interviewers"></div>
          <div class="form-group"><label class="f">Status</label><select id="f-status"><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>
          <div class="form-group"><label class="f">Location / Link</label><input type="text" id="f-location_or_link"></div>
          <div class="form-group span2"><label class="f">Logistics Notes</label><textarea id="f-logistics_notes" rows="2"></textarea></div>
        </div>
        <div style="margin-top:12px;"><button class="btn sm primary" id="save-logistics-btn">Save Logistics</button></div>
      </div>

      <div class="card">
        <div class="card-title">Prep Workspace</div>
        <div class="form-grid">
          <div class="form-group span2"><label class="f">Company Research</label><textarea id="f-company_research" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f">Role Research</label><textarea id="f-role_research" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f">Expected Questions</label><textarea id="f-expected_questions" rows="4"></textarea></div>
          <div class="form-group span2"><label class="f">STAR Stories</label><textarea id="f-star_stories" rows="4"></textarea></div>
          <div class="form-group span2"><label class="f">Technical / Case Preparation</label><textarea id="f-tech_prep" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f">Questions to Ask Employer</label><textarea id="f-questions_to_ask" rows="3"></textarea></div>
          <div class="form-group span2"><label class="f">General Notes</label><textarea id="f-general_notes" rows="3"></textarea></div>
        </div>
        <div style="margin-top:12px;"><button class="btn sm primary" id="save-prep-btn">Save Prep</button></div>
        <div class="ai-output" id="ai-output" style="display:none;"></div>
      </div>

      <div class="card">
        <div class="card-title">Question Log</div>
        <div id="q-list"></div>
        <div class="form-grid" style="margin-top:10px;">
          <div class="form-group span2"><label class="f">Question Asked</label><input type="text" id="q-question"></div>
          <div class="form-group"><label class="f">Tag</label>
            <select id="q-tag"><option value="">Select...</option></select>
          </div>
        </div>
        <div style="margin-top:10px;"><button class="btn sm" id="add-question-btn">+ Add Question</button></div>
      </div>

      <div class="card">
        <div class="card-title">Post-Interview Reflection &amp; Self-Assessment</div>
        <div class="self-grid" id="self-assessment-grid"></div>
        <div class="form-group span2" style="margin-top:14px;"><label class="f">Reflection — what went well, what could improve, unexpected questions, what you'd answer differently</label><textarea id="f-post_interview_reflection" rows="4"></textarea></div>
        <div class="form-group span2" style="margin-top:10px;"><label class="f">Outcome</label><input type="text" id="f-outcome" placeholder="e.g. Awaiting next round"></div>
        <div style="margin-top:12px;"><button class="btn sm primary" id="save-reflection-btn">Save Reflection</button></div>
      </div>
    </div>
  </div>

  <!-- Schedule modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title">Schedule Interview</div>
      <div class="form-grid">
        <div class="form-group span2"><label class="f">Opportunity *</label><select id="m-opportunity_id"></select></div>
        <div class="form-group"><label class="f">Round</label><input type="text" id="m-round"></div>
        <div class="form-group"><label class="f">Type</label>
          <select id="m-interview_type"><option value="">Select...</option></select>
        </div>
        <div class="form-group"><label class="f">Date</label><input type="date" id="m-interview_date"></div>
        <div class="form-group"><label class="f">Time</label><input type="text" id="m-interview_time"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn primary" id="modal-save">Schedule</button>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

</body>
</html>
